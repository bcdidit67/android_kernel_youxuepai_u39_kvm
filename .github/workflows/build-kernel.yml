name: build-kernel

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'defconfig 名称（先用 vendor 跑基线，通过后再跑 kvm）'
        required: true
        default: 'yxp_u39_vendor_defconfig'
        type: choice
        options:
          - donor_k71v1_kvm
          - yxp_u39_vendor_defconfig
          - yxp_u39_kvm_defconfig
      toolchain:
        description: '工具链'
        required: true
        default: 'gcc49-android'
        type: choice
        options:
          - gcc49-android
          - clang4691093
          - gcc-aarch64

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KCONFIG: ${{ github.event.inputs.config || 'yxp_u39_vendor_defconfig' }}
      TOOLCHAIN: ${{ github.event.inputs.toolchain || 'gcc49-android' }}
      UPSTREAM: https://github.com/CyberJalagam/kernel_oppo_mt6771
      UPSTREAM_BRANCH: 'Alien-Xtreme-master'

    steps:
      - name: Checkout（本仓库：只有 defconfig 与 workflow）
        uses: actions/checkout@v4

      - name: 安装基础依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev make git curl xz-utils cpio
          df -h /

      - name: 克隆上游 MTK ALPS 4.4.146 内核树
        run: |
          git clone --depth 1 -b "$UPSTREAM_BRANCH" "$UPSTREAM" kernel
          cd kernel
          echo '--- 关键目录自检 ---'
          ls virt/kvm/arm/ || true
          grep -n 'KVM_ARM_VGIC_V3' arch/arm64/kvm/Kconfig || true
          ls arch/arm64/boot/dts/mediatek | grep -E 'mt6771|evb6771' || true
          git log -1 --oneline

      - name: donor 树补丁（版本号对齐 4.4.146 + 自检）
        run: |
          cd kernel
          echo '--- 原始版本 ---'; sed -n '1,5p' Makefile
          # vermagic 必须与厂商内核 4.4.146 一致，否则 vendor 预编译 .ko 拒绝加载
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 146/' Makefile
          sed -i 's/^EXTRAVERSION = .*/EXTRAVERSION =/' Makefile
          echo '--- 补丁后版本 ---'; sed -n '1,5p' Makefile
          echo '--- 完整性自检 ---'
          for f in drivers/devfreq/helio-dvfsrc.h drivers/devfreq/helio-dvfsrc-opp.h \
                   drivers/mmc/host/mediatek/ComboA/autok.h \
                   drivers/misc/mediatek/base/power/cm_mgr_v1/mtk_cm_mgr.h \
                   virt/kvm/arm/vgic-v3.c virt/kvm/arm/vgic-v3-emul.c \
                   arch/arm64/boot/dts/mediatek/mt6771.dts ; do
            [ -f "$f" ] && echo "OK   $f" || echo "MISS $f"
          done

      - name: 取工具链 gcc49-android（AOSP 4.9 prebuilt，GitHub 镜像）
        if: env.TOOLCHAIN == 'gcc49-android'
        run: |
          set -e
          URL="https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/lineage-18.1.tar.gz"
          curl -fL --retry 3 -o /tmp/gcc49.tgz "$URL"
          mkdir -p "$RUNNER_TEMP/gcc49"
          tar -xzf /tmp/gcc49.tgz -C "$RUNNER_TEMP/gcc49" --strip-components=1
          chmod -R +x "$RUNNER_TEMP/gcc49/bin" || true
          ls "$RUNNER_TEMP/gcc49/bin" | head
          "$RUNNER_TEMP/gcc49/bin/aarch64-linux-android-gcc" --version | head -2

      - name: 取工具链 clang4691093（AOSP prebuilt，多 URL 回退）
        if: env.TOOLCHAIN == 'clang4691093'
        run: |
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          ok=0
          for U in \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-9.0.0_r34/clang-4691093.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-9.0.0_r34/clang-4691093.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-9.0.0_r9/clang-4691093.tar.gz" ; do
            echo "试: $U"
            if curl -fsL --retry 2 --max-time 180 -o /tmp/clang.tgz "$U"; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then echo '所有 clang 源都失败'; exit 1; fi
          mkdir -p "$RUNNER_TEMP/clang"
          tar -xzf /tmp/clang.tgz -C "$RUNNER_TEMP/clang"
          "$RUNNER_TEMP/clang/bin/clang" --version
          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"

      - name: 取工具链 gcc-aarch64（Ubuntu 自带交叉 gcc）
        if: env.TOOLCHAIN == 'gcc-aarch64'
        run: sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 放入 defconfig
        run: |
          if [ "$KCONFIG" != "donor_k71v1_kvm" ]; then
            cp "configs/${KCONFIG}" "kernel/arch/arm64/configs/${KCONFIG}"
            wc -l "kernel/arch/arm64/configs/${KCONFIG}"
          else
            echo 'donor 模式：直接使用内核树自带的 k71v1_64_bsp_defconfig'
          fi

      - name: 生成 .config 并打印 KVM 相关最终态
        working-directory: kernel
        run: |
          case "$TOOLCHAIN" in
            gcc49-android) CROSS="$RUNNER_TEMP/gcc49/bin/aarch64-linux-android-" ;;
            clang4691093)  CROSS="aarch64-linux-gnu-" ;;
            gcc-aarch64)   CROSS="aarch64-linux-gnu-" ;;
          esac
          echo "CROSS_COMPILE=$CROSS"
          if [ "$KCONFIG" = "donor_k71v1_kvm" ]; then
            make ARCH=arm64 CROSS_COMPILE="$CROSS" k71v1_64_bsp_defconfig
            ./scripts/config --file .config -e VIRTUALIZATION -e KVM -e MODVERSIONS \
              -d HARDEN_BRANCH_PREDICTOR --set-str LOCALVERSION ""
            make ARCH=arm64 CROSS_COMPILE="$CROSS" olddefconfig
          else
            make ARCH=arm64 CROSS_COMPILE="$CROSS" "${KCONFIG}"
          fi
          echo '--- KVM 相关 ---'
          grep -E 'CONFIG_(VIRTUALIZATION|KVM|KVM_ARM_VGIC_V3|HARDEN_BRANCH_PREDICTOR|MODVERSIONS|LOCALVERSION|ARM_GIC_V3|ARM_ARCH_TIMER|OF=|ARM64_4K_PAGES|ARM64_16K_PAGES)' .config || true

      - name: 编译 Image（只编内核；DTB 用原厂的，不编 dtbs）
        working-directory: kernel
        run: |
          set -o pipefail
          case "$TOOLCHAIN" in
            gcc49-android) CROSS="$RUNNER_TEMP/gcc49/bin/aarch64-linux-android-"; EXTRA="" ;;
            clang4691093)  CROSS="aarch64-linux-gnu-"; EXTRA="CC=clang CLANG_TRIPLE=aarch64-linux-gnu-" ;;
            gcc-aarch64)   CROSS="aarch64-linux-gnu-"; EXTRA="" ;;
          esac
          set +e
          # MTK ALPS 的私有头文件搜索路径（官方用 Android.mk 注入，裸 make 需要手动给）
          KCF="-I$PWD/drivers/devfreq -I$PWD/drivers/misc/mediatek/include -I$PWD/drivers/misc/mediatek/include/mt-plat -I$PWD/drivers/misc/mediatek/include/mt-plat/mt6771/include -I$PWD/drivers/misc/mediatek/base/power/include -I$PWD/drivers/misc/mediatek/base/power/mt6771"
          echo "KCFLAGS=$KCF"
          make ARCH=arm64 -j"$(nproc)" CROSS_COMPILE="$CROSS" $EXTRA KCFLAGS="$KCF" Image > /tmp/build.log 2>&1
          rc=$?
          set -e
          echo "make exit code: $rc ; log lines: $(wc -l < /tmp/build.log)"
          if [ "$rc" != "0" ]; then
            echo '=================== 错误摘要 ==================='
            grep -nE 'error:|Error [0-9]|fatal error|No rule to make target|undefined reference' /tmp/build.log | head -40 || true
            echo '=================== 日志末尾 120 行 ==================='
            tail -120 /tmp/build.log
            exit "$rc"
          fi
          tail -20 /tmp/build.log

      - name: 产物自检
        working-directory: kernel
        run: |
          ls -l arch/arm64/boot/Image
          echo '--- 版本串（须为 4.4.146，且没有 -dirty / +）---'
          strings arch/arm64/boot/Image | grep -m1 'Linux version 4' || true
          echo '--- KVM 符号 ---'
          strings arch/arm64/boot/Image | grep -iE 'kvm' | sort -u | head -15 || true
          echo '--- EL 判定串（首刷后看 dmesg）---'
          strings arch/arm64/boot/Image | grep -m2 'All CPU(s) started' || true
          sha256sum arch/arm64/boot/Image

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ env.KCONFIG }}-${{ env.TOOLCHAIN }}
          path: |
            kernel/arch/arm64/boot/Image
            kernel/.config
          if-no-files-found: error
          retention-days: 30