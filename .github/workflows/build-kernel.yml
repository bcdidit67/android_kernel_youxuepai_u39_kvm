name: build-kernel

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'defconfig 名称（vendor 基线 / KVM）'
        required: true
        default: 'yxp_u39_vendor_defconfig'
        type: choice
        options:
          - yxp_u39_vendor_defconfig
          - yxp_u39_kvm_defconfig
      toolchain:
        description: '工具链'
        required: true
        default: 'clang-4691093'
        type: choice
        options:
          - clang-4691093
          - gcc-aarch64
  push:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KCONFIG: ${{ github.event.inputs.config || 'yxp_u39_vendor_defconfig' }}
      TOOLCHAIN: ${{ github.event.inputs.toolchain || 'clang-4691093' }}
      UPSTREAM: https://github.com/Hadenix/android_kernel_alps-4.4
      UPSTREAM_BRANCH: '4.4.146'

    steps:
      - name: Checkout (本仓库：只含 defconfig 与 workflow)
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev make git curl xz-utils gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          df -h /

      - name: 克隆上游 MTK ALPS 4.4.146 内核树
        run: |
          git clone --depth 1 -b "$UPSTREAM_BRANCH" "$UPSTREAM" kernel
          cd kernel
          echo "--- 目录自检 ---"
          ls arch/arm64/configs | head -20
          ls arch/arm64/boot/dts/mediatek | grep -E 'mt6771|evb6771|k71v1' || true
          ls virt/kvm/arm/ || true
          git log -1 --oneline

      - name: 取 AOSP clang 4691093（与原厂编译内核所用版本一致）
        if: env.TOOLCHAIN == 'clang-4691093'
        run: |
          set -e
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-9.0.0_r1/clang-4691093.tar.gz"
          curl -fL --retry 3 -o /tmp/clang.tar.gz "$URL"
          mkdir -p "$RUNNER_TEMP/clang"
          tar -xzf /tmp/clang.tar.gz -C "$RUNNER_TEMP/clang"
          "$RUNNER_TEMP/clang/bin/clang" --version
          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"

      - name: 放入 defconfig
        run: |
          cp "configs/${KCONFIG}" "kernel/arch/arm64/configs/${KCONFIG}"
          ls -l "kernel/arch/arm64/configs/${KCONFIG}"

      - name: 生成 .config
        working-directory: kernel
        run: |
          if [ "$TOOLCHAIN" = "clang-4691093" ]; then
            export PATH="$RUNNER_TEMP/clang/bin:$PATH"
            make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- "${KCONFIG}"
          else
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "${KCONFIG}"
          fi
          echo '--- KVM 相关最终态 ---'
          grep -E 'CONFIG_(VIRTUALIZATION|KVM|KVM_ARM_MAX_VCPUS|HARDEN_BRANCH_PREDICTOR|MODVERSIONS|LOCALVERSION|ARM_GIC_V3|ARM_ARCH_TIMER|OF=|ARM64_4K_PAGES|ARM64_16K_PAGES)' .config || true

      - name: 编译 Image（只编内核，不编 dtb：DTB 用原厂的）
        working-directory: kernel
        run: |
          set -o pipefail
          if [ "$TOOLCHAIN" = "clang-4691093" ]; then
            make ARCH=arm64 -j"$(nproc)" \
              CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
              Image 2>&1 | tail -80
          else
            make ARCH=arm64 -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu- Image 2>&1 | tail -80
          fi

      - name: 产物自检
        working-directory: kernel
        run: |
          ls -l arch/arm64/boot/Image
          echo '--- 版本串（必须是 4.4.146 且无 -dirty / + 后缀）---'
          strings arch/arm64/boot/Image | grep -m1 'Linux version 4'
          echo '--- KVM 符号 ---'
          strings arch/arm64/boot/Image | grep -iE '^kvm|kvm_vgic' | head -10 || true
          echo '--- EL 判定串（首刷后看 dmesg 用）---'
          strings arch/arm64/boot/Image | grep -m2 'All CPU(s) started' || true
          sha256sum arch/arm64/boot/Image

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ env.KCONFIG }}-${{ env.TOOLCHAIN }}
          path: |
            kernel/arch/arm64/boot/Image
            kernel/.config
          if-no-files-found: error
          retention-days: 30